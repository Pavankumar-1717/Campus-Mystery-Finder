spring.application.name=Lost & Found – Campus Mystery Finder
server.port=8080

# Primary database: H2 in-memory or file mode
spring.datasource.url=jdbc:h2:mem:campus_mystery_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL configuration (Optional: uncomment if you prefer MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/campus_mystery_finder?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# File uploads for photos/camera snapshots
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
spring.thymeleaf.cache=false

# Upload directory configuration
app.upload.dir=uploads
