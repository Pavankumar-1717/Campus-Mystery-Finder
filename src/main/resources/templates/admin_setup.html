<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Password Setup · Campus Mystery Finder</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/login">
    <div class="brand-icon">⌕</div>
    <span>Campus Mystery Finder</span>
  </a>
  <div class="nav-links">
    <a href="/login?role=ADMIN">Back to Admin Login</a>
  </div>
</header>

<div th:if="${success}" class="notice-bar success" th:text="${success}"></div>
<div th:if="${error}" class="notice-bar error" th:text="${error}"></div>

<main>
  <div class="form-wrap" style="max-width: 520px;">
    <a href="/login" class="back-link">← Back to Portal Gateway</a>
    <span class="eyebrow">CAMPUS AUTHORITY</span>
    <h1>Create Admin Password</h1>
    <p class="subtitle">Set up your administrator credentials to review verification claims and authorize campus item returns.</p>

    <form th:action="@{/admin/setup}" method="post">
      <label for="adminEmail">Admin Email <span class="req">*</span></label>
      <input type="email" id="adminEmail" name="email" required placeholder="admin@campus.edu">

      <label for="adminFullName">Admin Full Name <span class="req">*</span></label>
      <input type="text" id="adminFullName" name="fullName" required placeholder="e.g. Campus Security Incharge">

      <div class="two-col">
        <div>
          <label for="adminPassword">Create Password <span class="req">*</span></label>
          <input type="password" id="adminPassword" name="password" minlength="6" required placeholder="At least 6 chars">
        </div>
        <div>
          <label for="confirmPassword">Confirm Password <span class="req">*</span></label>
          <input type="password" id="confirmPassword" name="confirmPassword" minlength="6" required placeholder="Re-enter password">
        </div>
      </div>

      <label for="securityCode">Campus Authority Security Key <span class="req">*</span>
        <small>Secret key required to grant admin authority (Default: <code>CAMPUS-ADMIN-2026</code>)</small>
      </label>
      <input type="text" id="securityCode" name="securityCode" required placeholder="CAMPUS-ADMIN-2026" value="CAMPUS-ADMIN-2026">

      <button type="submit" class="button primary full" style="margin-top: 1.8rem; background: #0f172a;">
        🛡️ Create Password & Register Admin
      </button>
    </form>
  </div>
</main>

<footer>
  Lost & Found – Campus Mystery Finder · Authorized Access Only
</footer>

</body>
</html>
